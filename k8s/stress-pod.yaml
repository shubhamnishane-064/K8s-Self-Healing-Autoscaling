apiVersion: v1
kind: Pod
metadata:
  name: cpu-stressor
  namespace: demo
spec:
  restartPolicy: Never
  containers:
  - name: stressor
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Starting load generator against demo-app..."
      while true; do
        # Fire off 20 parallel /burn requests, each keeping a core busy
        for i in $(seq 1 20); do
          wget -q -O- http://demo-app:8080/burn &
        done
        wait
      done